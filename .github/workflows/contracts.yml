name: contracts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install jsonschema pytest import-linter redis fakeredis confluent-kafka fastapi "uvicorn[standard]" httpx wsproto
      - name: Contract gate + dependency rule (pytest)
        run: python -m pytest -q
      - name: Import-linter (ADR-002 hexagonal boundary)
        run: lint-imports
      - name: Extraction eval gate (>=20 cases vs recorded baseline)
        run: python -m pricing.evals.run
      - name: Train baseline model
        run: python -m pricing.training.train --n 8000
      - name: Latency gate (CI threshold, see docs/latency-harness.md)
        run: python benchmarks/latency.py --n 2000 --warmup 200 --max-p99 150 --json
      - name: HTTP latency gate (CI threshold150, see docs/API.md)
        run: python benchmarks/http_latency.py --n 1500 --warmup 200 --max-p99 150
